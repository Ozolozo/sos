<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>SOS – Fiche d'urgence</title>
<style>
  :root{--rouge:#c62828;--rouge-clair:#fdecea;--texte:#1b1b1b;--gris:#5f6368;--bord:#e0e0e0;--fond:#f5f5f5;--vert:#2e7d32}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texte);background:var(--fond)}
  main{max-width:640px;margin:0 auto;padding:12px 12px 40px}
  h1{font-size:1.6rem;margin:.2rem 0}
  h2{font-size:1.05rem;margin:0 0 .6rem;color:var(--gris);text-transform:uppercase;letter-spacing:.03em}
  a{color:#1565c0}
  .card{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:14px;margin:12px 0}
  .btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font:600 1.05rem system-ui,sans-serif;text-align:center;text-decoration:none;cursor:pointer;background:#1b1b1b;color:#fff}
  .btn.sec{background:#fff;color:var(--texte);border:1px solid var(--bord)}
  .btn.rouge{background:var(--rouge)}
  .btn.petit{display:inline-block;width:auto;padding:9px 12px;font-size:.95rem}
  .btn:disabled{opacity:.6}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .small{font-size:.85rem;color:var(--gris)}
  .msg{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:.95rem}
  .msg.ok{background:#e8f5e9;color:var(--vert)}
  .msg.ko{background:var(--rouge-clair);color:var(--rouge)}
  .msg.info{background:#e3f2fd;color:#0d47a1}
  /* Fiche d'urgence */
  .urg{background:var(--rouge);color:#fff;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .urg-t{font-weight:800;font-size:1.25rem;letter-spacing:.02em}
  .langs button{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:6px;padding:3px 7px;margin-left:3px;font-weight:600;cursor:pointer}
  .langs button.on{background:#fff;color:var(--rouge)}
  .btn-112{background:var(--rouge);font-size:1.25rem;padding:18px;margin-top:12px}
  dl{margin:0}
  dt{font-size:.8rem;color:var(--gris);text-transform:uppercase;letter-spacing:.03em}
  dl>div{margin-top:12px}
  dl>div:first-child{margin-top:0}
  dd{margin:2px 0 0;font-size:1.05rem;white-space:normal}
  dd.vide{color:var(--gris);font-style:italic}
  .alerte dd{background:var(--rouge-clair);color:var(--rouge);font-weight:700;padding:6px 8px;border-radius:6px}
  .contact{border-top:1px solid var(--bord);padding-top:10px;margin-top:10px}
  .contact:first-of-type{border-top:0;margin-top:0;padding-top:0}
  .contact .nom{font-weight:700;font-size:1.1rem}
  .contact .row .btn{flex:1}
  .gestes ol{margin:0;padding-left:1.2rem}
  .gestes li{margin:4px 0}
  /* Formulaire */
  label.f{display:block;margin:10px 0 0;font-weight:600;font-size:.95rem}
  label.f .req{color:var(--rouge)}
  input[type=text],input[type=tel],input[type=email],input[type=date],select,textarea{width:100%;margin-top:4px;padding:10px;border:1px solid #c7c7c7;border-radius:8px;font:inherit;background:#fff}
  textarea{min-height:64px;resize:vertical}
  label.cb{display:flex;gap:8px;align-items:flex-start;margin:12px 0 0;font-size:.95rem}
  label.cb input{margin-top:3px}
  fieldset{border:0;padding:0;margin:0}
  #qrbox{display:flex;justify-content:center}
  #qrbox svg{width:210px;height:210px}
  .danger{border-color:#f3c0bd}
  /* Impression */
  #print-area{display:none}
  @media print{
    body{background:#fff}
    body>*:not(#print-area){display:none!important}
    #print-area{display:block}
    @page{size:A4;margin:10mm}
  }
  #print-area *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .planche{display:grid;gap:4mm;justify-content:start}
  .planche.casque{grid-template-columns:repeat(5,31mm)}
  .planche.standard{grid-template-columns:repeat(4,43mm)}
  .stk{border:.2mm dashed #bbb;border-radius:2mm;background:#fff;text-align:center;break-inside:avoid;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
  .stk .bd{background:#c62828;color:#fff;font-weight:700;letter-spacing:.2mm}
  .stk .tx{color:#000;line-height:1.15}
  .casque .bd{font-size:6.5pt;padding:.8mm 0}
  .casque .tx{font-size:5.5pt;padding:0 1mm 1mm}
  .casque .ice{font-size:6pt;font-weight:700;padding-bottom:1mm}
  .standard .bd{font-size:9pt;padding:1.2mm 0}
  .standard .tx{font-size:7pt;padding:0 1mm 1mm}
  .standard .ice{font-size:8pt;font-weight:700;padding-bottom:1.5mm}
  .stk svg{display:block;margin:1mm auto .5mm}
  .cartes{display:grid;gap:6mm;grid-template-columns:85.6mm}
  .carte{width:85.6mm;height:54mm;border:.2mm dashed #bbb;border-radius:3mm;display:flex;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#fff}
  .carte .g{width:44mm;display:flex;align-items:center;justify-content:center}
  .carte .d{flex:1;padding:3mm 3mm 3mm 0;display:flex;flex-direction:column;justify-content:center;font-size:7.5pt;line-height:1.3;color:#000}
  .carte .t{color:#c62828;font-weight:800;font-size:10pt}
  .carte .n{font-weight:700;font-size:9.5pt;margin:1.5mm 0}
</style>
</head>
<body>
<main id="app"><p class="small">Chargement…</p></main>
<div id="print-area"></div>

function telInternational(t) {
  const s = String(t || '').replace(/[^\d+]/g, '');
  return /^0[1-9]\d{8}$/.test(s) ? '+33' + s.slice(1) : String(t || '').trim();
}
function stockage(cle, val) {
  try { if (val === undefined) return localStorage.getItem(cle); if (val === null) localStorage.removeItem(cle); else localStorage.setItem(cle, val); } catch (e) { return null; }
}

/* ------------------------------ API ------------------------------ */
async function apiGet(p) {
  const u = new URL(CONFIG.API_URL);
  Object.entries(p).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u.toString(), { redirect: 'follow' });
  return r.json();
}
async function apiPost(body) {
  const r = await fetch(CONFIG.API_URL, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  return r.json();
}
const apiConfiguree = () => /^https?:\/\//.test(CONFIG.API_URL);

/* ------------------------------ QR ------------------------------ */
function makeQR(text) { const q = qrcode(0, 'Q'); q.addData(text); q.make(); return q; }
function qrSvg(text, taille) {
  const q = makeQR(text), n = q.getModuleCount(), m = 2, N = n + 2 * m;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + N + ' ' + N + '" width="' + taille + '" height="' + taille +
    '" shape-rendering="crispEdges"><rect width="' + N + '" height="' + N + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}
function dessinerQR(g, text, x, y, taillePx, marge) {
  const q = makeQR(text), n = q.getModuleCount(), N = n + 2 * marge, cell = Math.floor(taillePx / N), S = cell * N;
  g.fillStyle = '#fff'; g.fillRect(x, y, S, S);
  g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) g.fillRect(x + (c + marge) * cell, y + (r + marge) * cell, cell, cell);
  return S;
}
function telechargerCanvas(cv, nom) {
  cv.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = nom;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, 'image/png');
}

function age(dateIso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateIso || '');
  if (!m) return null;
  const n = new Date(+m[1], +m[2] - 1, +m[3]), a = new Date();
  let x = a.getFullYear() - n.getFullYear();
  if (a.getMonth() < n.getMonth() || (a.getMonth() === n.getMonth() && a.getDate() < n.getDate())) x--;
  return x;
}
const dateFr = d => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : esc(d); };

function smsHref(tel, texte) { return 'sms:' + telLien(tel) + '?&body=' + encodeURIComponent(texte); }
function texteSms(f, pos, id) {

}

async function vueUrgence(id) {
  const etat = { fiche: null, erreur: null, pos: '', msg: '' };
  const rendre = () => {
    const t = T[LANG];

    if (etat.erreur) {
      h += '<div class="msg ko">' + esc(etat.erreur === 'reseau' ? t.reseau : t.introuvable) + '</div>';
    } else if (!etat.fiche) {
      h += '<p class="small">…</p>';
    } else {
      const f = etat.fiche, a = age(f.dateNaissance);
      const ligne = (lbl, v, alerte) => '<div class="' + (alerte && v ? 'alerte' : '') + '"><dt>' + lbl + '</dt>' +
        (v ? '<dd>' + nl2br(v) + '</dd>' : '<dd class="vide">' + t.nr + '</dd>') + '</div>';
      h += '<section class="card"><h1>' + esc(f.prenom) + ' ' + esc(String(f.nom).toUpperCase()) + '</h1>' +
        (f.dateNaissance ? '<div>' + t.ne + ' ' + dateFr(f.dateNaissance) + (a !== null ? ' · ' + a + ' ' + t.ans : '') + '</div>' : '') +
        (f.langues ? '<div class="small">' + t.langues + ' : ' + esc(f.langues) + '</div>' : '') + '</section>';
      h += '<section class="card"><h2>' + t.medical + '</h2><dl>' +
        ligne(t.groupe, f.groupeSanguin) + ligne(t.allergies, f.allergies, true) + ligne(t.traitements, f.traitements, true) +
        ligne(t.antecedents, f.antecedents) + ligne(t.infos, f.infos) + '</dl></section>';
      h += '<section class="card"><h2>' + t.contacts + '</h2>';
      [1, 2].forEach(i => {
        const tel = f['contact' + i + 'Tel'];
        if (!tel) return;
        h += '<div class="contact"><div class="nom">' + esc(f['contact' + i + 'Nom']) +
          (f['contact' + i + 'Lien'] ? ' <span class="small">(' + esc(f['contact' + i + 'Lien']) + ')</span>' : '') + '</div>' +
          '<div>' + esc(tel) + '</div><div class="row">' +
          '<a class="btn" href="tel:' + esc(telLien(tel)) + '">📞 ' + t.appeler + '</a>' +
          '<a class="btn sec" href="' + esc(smsHref(tel, texteSms(f, etat.pos, id))) + '">💬 ' + t.sms + '</a></div></div>';
      });
      h += '<div class="row"><button class="btn rouge" id="btnPos">' + t.prevenir + '</button></div>' +
        (etat.msg ? '<div class="msg info" id="posMsg">' + esc(etat.msg) + '</div>' : '') + '</section>';
      h += '<section class="card gestes"><h2>' + t.gestesT + '</h2><ol>' + t.gestes.map(g => '<li>' + esc(g) + '</li>').join('') + '</ol></section>';
      h += '<p class="small" style="text-align:center">' + esc(CONFIG.NOM_CLUB) + '</p>';
    }
    $app.innerHTML = h;
    $app.querySelectorAll('.langs button').forEach(b => b.onclick = () => { LANG = b.dataset.l; rendre(); });
    const bp = document.getElementById('btnPos');
    if (bp) bp.onclick = prevenir;
  };

  async function envoyerAlerte(coords) {
    const body = { action: 'alerte', id };
    if (coords) { body.lat = coords.latitude; body.lng = coords.longitude; body.precision = coords.accuracy; }
    try {
      const r = await apiPost(body);
      return r.dejaEnvoyee ? T[LANG].deja : (r.ok ? T[LANG].mails(r.envoyes) : '');
    } catch (e) { return ''; }
  }
  function prevenir() {
    const t = T[LANG];
    etat.msg = t.posEnCours; rendre();
    const fin = async (coords) => {
      if (coords) etat.pos = 'https://www.google.com/maps?q=' + coords.latitude.toFixed(6) + ',' + coords.longitude.toFixed(6);
      const m = await envoyerAlerte(coords);
      etat.msg = (coords ? T[LANG].posOk : T[LANG].posKo) + (m ? ' ' + m : '');
      rendre();
    };
    if (!navigator.geolocation) return fin(null);
    navigator.geolocation.getCurrentPosition(p => fin(p.coords), () => fin(null),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  }

  rendre();
  try {
    const r = await apiGet({ action: 'fiche', id });
    if (r.ok) etat.fiche = r.fiche; else etat.erreur = r.erreur || 'introuvable';
  } catch (e) { etat.erreur = 'reseau'; }
  rendre();
}

function formulaire(f) {
  let h = '', ouvert = false;
  SCHEMA.forEach(c => {
    if (c.s) { h += (ouvert ? '</section>' : '') + '<section class="card"><h2>' + esc(c.s) + '</h2>'; ouvert = true; return; }
    const v = f[c.k] == null ? '' : f[c.k];
    const lbl = esc(c.l) + (c.req ? ' <span class="req">*</span>' : '');
    const attrs = 'name="' + c.k + '"' + (c.req ? ' required' : '') + (c.ph ? ' placeholder="' + esc(c.ph) + '"' : '');
    if (c.t === 'cb') h += '<label class="cb"><input type="checkbox" ' + attrs + (v !== 'NON' ? ' checked' : '') + '> ' + lbl + '</label>';
    else if (c.t === 'ta') h += '<label class="f">' + lbl + '<textarea ' + attrs + ' maxlength="600">' + esc(v) + '</textarea></label>';
    else if (c.t === 'select') h += '<label class="f">' + lbl + '<select ' + attrs + '>' +
      c.o.map(o => '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + (o || 'Non renseigné') + '</option>').join('') + '</select></label>';
    else h += '<label class="f">' + lbl + '<input type="' + (c.t || 'text') + '" ' + attrs + ' maxlength="600" value="' + esc(v) + '"></label>';
  });
  return h + '</section>';
}
function lireFormulaire(form) {
  const f = {};
  SCHEMA.forEach(c => {
    if (!c.k) return;
    const el = form.elements[c.k];
    if (c.t === 'cb') f[c.k] = el.checked ? 'OUI' : 'NON';
    else f[c.k] = el.value.trim();
    if (c.t === 'tel') f[c.k] = telInternational(f[c.k]);
  });
  return f;
}

function imprimer(type, f, iceClair) {
  const url = publicUrl(f.id);
  const ice = iceClair && f.contact1Tel ? 'ICE ' + esc(f.contact1Tel) : '';
  let h;
  if (type === 'carte') {
    const carte = '<div class="carte"><div class="g">' + qrSvg(url, '40mm') + '</div><div class="d">' +
      '<div class="t">FICHE D’URGENCE</div><div>Emergency info – scan me</div>' +
      '<div class="n">' + esc(f.prenom) + ' ' + esc(String(f.nom).toUpperCase()) + '</div>' +
      (f.groupeSanguin ? '<div>Groupe sanguin : <b>' + esc(f.groupeSanguin) + '</b></div>' : '') +
      (iceClair && f.contact1Tel ? '<div>ICE : ' + esc(f.contact1Nom) + '<br><b>' + esc(f.contact1Tel) + '</b></div>' : '') +
      '</div></div>';
    h = '<div class="cartes">' + carte + carte + '</div>';
  } else {
    const mm = type === 'casque' ? 26 : 38, nb = type === 'casque' ? 20 : 12;
    const s = '<div class="stk"><div class="bd">URGENCE · ICE</div>' + qrSvg(url, mm + 'mm') +
      '<div class="tx">Scannez-moi en cas d’accident<br>Scan me in case of emergency</div>' +
      (ice ? '<div class="tx ice">' + ice + '</div>' : '') + '</div>';
    h = '<div class="planche ' + type + '">' + s.repeat(nb) + '</div>';
  }
  $print.innerHTML = h;
  setTimeout(() => window.print(), 50);
}

function fondEcran(f) {
  const W = 1080, H = 2340, cv = document.createElement('canvas'), g = cv.getContext('2d');
  cv.width = W; cv.height = H;
  g.fillStyle = '#111'; g.fillRect(0, 0, W, H);
  g.textAlign = 'center';
  const y = 1180;
  g.fillStyle = '#ef5350'; g.font = 'bold 66px system-ui, Arial, sans-serif';
  g.fillText('EN CAS D’URGENCE', W / 2, y - 120);
  g.fillStyle = '#fff'; g.font = '40px system-ui, Arial, sans-serif';
  g.fillText('Scannez ce code · Scan this code', W / 2, y - 55);
  const N = makeQR(publicUrl(f.id)).getModuleCount() + 6, S = Math.floor(560 / N) * N;
  dessinerQR(g, publicUrl(f.id), Math.round((W - S) / 2), y, 560, 3);
  g.fillStyle = '#fff'; g.font = 'bold 48px system-ui, Arial, sans-serif';
  g.fillText(f.prenom + ' ' + String(f.nom).toUpperCase(), W / 2, y + S + 80);
  if (f.contact1Tel) {
    g.font = '40px system-ui, Arial, sans-serif';
    g.fillText('ICE : ' + (f.contact1Nom || '') + ' ' + f.contact1Tel, W / 2, y + S + 140);
  }
  telechargerCanvas(cv, 'fond-ecran-urgence.png');
}

/* ======================== VUE 3 : ACCUEIL ======================== */
function vueAccueil() {
  const k = stockage('sos_k');
  $app.innerHTML =
    '<h1>🚑 Fiche d’urgence QR</h1><p>' + esc(CONFIG.NOM_CLUB) + '</p>' +
    '<section class="card"><p>Un QR code sur votre casque, votre vélo ou dans votre portefeuille : en cas d’accident, ' +
    'toute personne sur place accède à vos informations vitales et peut prévenir vos proches, sans application.</p>' +
    (k ? '<a class="btn" href="?k=' + encodeURIComponent(k) + '">Modifier ma fiche</a><div style="height:8px"></div>' : '') +
    '<a class="btn ' + (k ? 'sec' : '') + '" href="?new">Créer ma fiche</a><div style="height:8px"></div>' +
    (k ? '' : '<a class="btn sec" href="?retrouver">J’ai déjà une fiche</a>') + '</section>';
}

/* =============== VUE 4 : RETROUVER SON LIEN PERSONNEL =============== */
function vueRetrouver() {
  $app.innerHTML =
    '<h1>J’ai déjà une fiche</h1>' +
    '<section class="card"><p>Saisissez l’adresse e-mail indiquée dans votre fiche : vous recevrez votre lien personnel ' +
    'pour la modifier et imprimer vos QR codes.</p>' +
    '<form id="fr" novalidate><label class="f">Mon e-mail <span class="req">*</span>' +
    '<input type="email" name="email" required autocomplete="email"></label>' +
    '<div id="st"></div><button class="btn" type="submit" style="margin-top:12px">Recevoir mon lien</button></form></section>' +
    '<p class="small"><a href="./">← Retour</a></p>';
  const fr = document.getElementById('fr');
  fr.onsubmit = async ev => {
    ev.preventDefault();
    if (!fr.reportValidity()) return;
    const st = document.getElementById('st'), bt = fr.querySelector('button');
    bt.disabled = true; st.innerHTML = '<div class="msg info">Envoi…</div>';
    try {
      const r = await apiPost({ action: 'retrouver', email: fr.elements.email.value.trim() });
      if (!r.ok) throw new Error(r.detail || MSG_ERREUR[r.erreur] || r.erreur);
      st.innerHTML = '<div class="msg ok">Si une fiche est associée à cette adresse, un e-mail contenant votre lien personnel ' +
        'vient d’être envoyé. Pensez à vérifier vos spams.</div>';
    } catch (e) {
      st.innerHTML = '<div class="msg ko">' + esc(e.message === 'Failed to fetch' ? MSG_ERREUR.reseau : e.message) + '</div>';
      bt.disabled = false;
    }
  };
}

/* ============================ ROUTEUR ============================ */
(function () {
  if (!apiConfiguree()) {
    $app.innerHTML = '<div class="msg ko">Configuration incomplète : renseignez CONFIG.API_URL dans index.html.</div>' +
      (params.get('id') ? '<a class="btn btn-112" href="tel:112">📞 112</a>' : '');
    return;
  }
  if (params.get('id')) return vueUrgence(params.get('id'));
  if (params.get('k')) return vueEdition(params.get('k'));
  if (params.has('new')) return vueCreation();
  if (params.has('retrouver')) return vueRetrouver();
  vueAccueil();
})();
</script>
